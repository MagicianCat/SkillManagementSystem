spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: skill-management-system

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/skill_management?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:sms_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SkillManagementHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_ARCHIVE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:55MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

auth:
  browser:
    cookie-secure: ${AUTH_BROWSER_COOKIE_SECURE:false}
    cookie-max-age-seconds: ${AUTH_BROWSER_COOKIE_MAX_AGE_SECONDS:604800}
    allowed-origins: ${AUTH_BROWSER_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  ide:
    verification-uri: ${IDE_AUTH_VERIFICATION_URI:http://127.0.0.1:5173/ide/authorize}
    poll-interval-seconds: ${IDE_AUTH_POLL_INTERVAL_SECONDS:5}
    cleanup-interval-ms: ${IDE_AUTH_CLEANUP_INTERVAL_MS:3600000}
    rate-limit:
      create-per-minute: ${IDE_AUTH_CREATE_PER_MINUTE:10}
      approve-per-minute: ${IDE_AUTH_APPROVE_PER_MINUTE:10}
      poll-per-minute: ${IDE_AUTH_POLL_PER_MINUTE:30}
      max-entries: ${IDE_AUTH_RATE_LIMIT_MAX_ENTRIES:10000}

logging:
  level:
    root: info
    com.company.skillplatform: info
    com.company.skillplatform.common.logging: info
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS'Z',UTC} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

knowledge:
  enabled: ${KNOWLEDGE_ENABLED:true}
  qdrant:
    base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:wiki_chunks_v1}
    connect-timeout: ${QDRANT_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${QDRANT_REQUEST_TIMEOUT:PT5S}
  embedding:
    url: ${KB_EMBEDDING_URL:https://tkcopilot.taikang.com/v1/tongyi/embeddings}
    api-key: ${KB_EMBEDDING_API_KEY:}
    model: ${KB_EMBEDDING_MODEL:qwen3-embedding-0.6b}
    dimensions: ${KB_EMBEDDING_DIMENSIONS:1024}
    batch-size: ${KB_EMBEDDING_BATCH_SIZE:16}
    timeout: ${KB_EMBEDDING_TIMEOUT:PT15S}
  rerank:
    enabled: ${KB_RERANK_ENABLED:true}
    url: ${KB_RERANK_URL:https://tkcopilot.taikang.com/v1/tongyi/rerank}
    api-key: ${KB_RERANK_API_KEY:${KB_EMBEDDING_API_KEY:}}
    model: ${KB_RERANK_MODEL:qwen3-reranker-0.6b}
    timeout: ${KB_RERANK_TIMEOUT:PT10S}
  search:
    chunk-top-k: ${KB_CHUNK_TOP_K:12}
    document-top-k: ${KB_DOCUMENT_TOP_K:5}
    snippets-per-document: ${KB_SNIPPETS_PER_DOCUMENT:2}
  chunk:
    target-chars: ${KB_CHUNK_TARGET_CHARS:3000}
    overlap-chars: ${KB_CHUNK_OVERLAP_CHARS:400}
  reconcile:
    enabled: ${KB_RECONCILE_ENABLED:true}
    initial-delay-ms: ${KB_RECONCILE_INITIAL_DELAY_MS:30000}
    fixed-delay-ms: ${KB_RECONCILE_DELAY_MS:600000}

skill-platform:
  feishu:
    enabled: ${FEISHU_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:http://127.0.0.1:5173/oauth/callback}
    mock-https-enabled: ${FEISHU_MOCK_HTTPS_ENABLED:false}
    mock-https-base-url: ${FEISHU_MOCK_HTTPS_BASE_URL:}
    authorize-url: ${FEISHU_AUTHORIZE_URL:https://accounts.feishu.cn/open-apis/authen/v1/authorize}
    token-url: ${FEISHU_TOKEN_URL:https://open.feishu.cn/open-apis/authen/v2/oauth/token}
    user-info-url: ${FEISHU_USER_INFO_URL:https://open.feishu.cn/open-apis/authen/v1/user_info}
    api-base-url: ${FEISHU_API_BASE_URL:https://open.feishu.cn/open-apis}
    token-encryption-key: ${FEISHU_TOKEN_ENCRYPTION_KEY:}
    event-enabled: ${FEISHU_EVENT_ENABLED:false}
    bot-enabled: ${FEISHU_BOT_ENABLED:${FEISHU_EVENT_ENABLED:false}}
    bot-web-base-url: ${FEISHU_BOT_WEB_BASE_URL:http://127.0.0.1:5173}
    bot-task-interval-ms: ${FEISHU_BOT_TASK_INTERVAL_MS:2000}
    bot-max-retries: ${FEISHU_BOT_MAX_RETRIES:3}
    oauth-state-ttl: ${FEISHU_OAUTH_STATE_TTL:5m}
  auth:
    jwt:
      issuer: ${JWT_ISSUER:skill-management-system}
      signing-key: ${JWT_SIGNING_KEY}
      access-ttl: ${JWT_ACCESS_TTL:30m}
      refresh-ttl: ${JWT_REFRESH_TTL:7d}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:skill-management}
  upload:
    max-expanded-size: ${UPLOAD_MAX_EXPANDED_SIZE:200MB}
    max-file-count: ${UPLOAD_MAX_FILE_COUNT:2000}
  telemetry:
    encryption-key: ${SKILL_USAGE_ENCRYPTION_KEY:}
